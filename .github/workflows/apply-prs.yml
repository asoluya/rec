name: Apply PRs bundle
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unpack and commit
        run: |
          unzip -o prs-bundle.zip
          rm -f prs-bundle.zip
          rm -f .github/workflows/apply-prs.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "应用上游 PR #30/#31/#47/#72/#85/#86/#88（触摸修复、解密/安装/MTP 修复、Root 页）"
          git pull --rebase origin main
          git push origin main
